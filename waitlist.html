<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07101d"><meta name="description" content="Join the LaunchOS early access waitlist."><title>LaunchOS — Early Access</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><style>:root{--bg:#07101d;--panel:#0a1626;--text:#f6fbff;--muted:#8d9db1;--cyan:#62d2ff;--line:rgba(255,255,255,.085)}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,rgba(0,157,255,.15),transparent 40%),var(--bg);color:var(--text);font-family:Inter,sans-serif;display:grid;place-items:center}.shell{width:min(580px,calc(100% - 32px));text-align:center}.brand{display:flex;align-items:center;justify-content:center;gap:9px;font:700 20px 'Space Grotesk';margin-bottom:60px}.brand img{width:46px;height:40px;object-fit:contain}.k{font:500 10px 'DM Mono';letter-spacing:.15em;color:var(--cyan);text-transform:uppercase}.box{border:1px solid var(--line);border-radius:20px;padding:55px 40px;background:rgba(10,22,38,.82);box-shadow:0 40px 110px rgba(0,0,0,.35)}h1{font:600 clamp(40px,7vw,62px)/1 'Space Grotesk';letter-spacing:-.06em;margin:15px 0}.copy{color:var(--muted);font-size:14px;line-height:1.8;max-width:470px;margin:auto}.form{display:flex;gap:9px;margin-top:30px}.form input{flex:1;min-width:0;padding:14px;border:1px solid var(--line);border-radius:9px;background:#07111f;color:#fff;outline:none;font:13px Inter}.form input:focus{border-color:rgba(98,210,255,.5)}button{border:0;border-radius:9px;padding:0 18px;background:#f1f8ff;color:#06101b;font-weight:700;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.status{display:none;margin-top:18px;padding:14px;border-radius:9px;font-size:12px;line-height:1.5}.success{display:block;background:rgba(101,231,167,.06);border:1px solid rgba(101,231,167,.16);color:#79e8ad}.error{display:block;background:rgba(255,90,90,.06);border:1px solid rgba(255,90,90,.16);color:#ff9c9c}.fine{margin-top:18px;color:#60738a;font:400 9px 'DM Mono'}.back{display:inline-block;margin-top:28px;color:#8a9caf;text-decoration:none;font-size:11px}.back:hover{color:#fff}@media(max-width:560px){.box{padding:42px 22px}.form{flex-direction:column}.form button{height:48px}}</style></head><body><main class="shell"><div class="brand"><img src="assets/launchos-logo.svg" alt="LaunchOS logo"><span>LaunchOS</span></div><section class="box"><div class="k">Early access</div><h1>Be first to launch.</h1><p class="copy">Join the first wave of builders getting access to LaunchOS — the AI-native operating system for Solana token teams.</p><form class="form" id="waitlist"><input id="email" type="email" placeholder="you@example.com" autocomplete="email" required><button id="submit">Join waitlist →</button></form><div class="status" id="status"></div><div class="fine">NO WALLET REQUIRED · EARLY ACCESS · LAUNCHOS</div></section><a class="back" href="index.html">← Back to LaunchOS</a></main><script>const ENDPOINT='https://yeostbvulynfpavijaar.supabase.co/functions/v1/join-waitlist';const form=document.getElementById('waitlist'),email=document.getElementById('email'),button=document.getElementById('submit'),status=document.getElementById('status');form.addEventListener('submit',async e=>{e.preventDefault();const value=email.value.trim().toLowerCase();if(!value)return;button.disabled=true;button.textContent='Joining…';status.className='status';status.style.display='none';try{const res=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:value})});const data=await res.json();if(!res.ok)throw new Error(data.error||'Request failed');status.textContent=data.alreadyJoined?'You’re already on the LaunchOS waitlist. 🚀':'You’re on the LaunchOS waitlist. We’ll be in touch when early access opens.';status.className='status success';status.style.display='block';form.reset()}catch(err){status.textContent='Something went wrong. Please try again in a moment.';status.className='status error';status.style.display='block'}finally{button.disabled=false;button.textContent='Join waitlist →'}});</script></body></html>
